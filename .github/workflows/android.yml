name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu runners have the Android SDK preinstalled,
          # but sdkmanager is not guaranteed to be on PATH.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER=""
          for candidate in             "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "$SDK_ROOT/cmdline-tools/*/bin/sdkmanager"             "$SDK_ROOT/tools/bin/sdkmanager"; do
            for path in $candidate; do
              if [ -x "$path" ]; then
                SDKMANAGER="$path"
                break 2
              fi
            done
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install             "platforms;android-36"             "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: morse-luz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
